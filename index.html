<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>✨ Image Carousel</h1>
        <p class="subtitle">Explore beautiful places around the world</p>

        <div class="carousel" id="carousel">
            <div class="slides">
                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80" alt="Beautiful mountain landscape">
                    <div class="caption">Nature's Beauty 🌿</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&q=80" alt="Ocean waves">
                    <div class="caption">Peaceful Ocean 🌊</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80" alt="Snowy mountains under stars">
                    <div class="caption">Mountain Dreams 🏔️</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80" alt="Lake surrounded by mountains">
                    <div class="caption">Serene Escape 🏞️</div>
                </div>

                <div class="slide">
                    <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=1200&q=80" alt="Golden sunrise over a landscape">
                    <div class="caption">Golden Sunrise 🌅</div>
                </div>
            </div>

            <button class="nav-btn prev" id="prevBtn" aria-label="Previous slide">❮</button>
            <button class="nav-btn next" id="nextBtn" aria-label="Next slide">❯</button>

            <div class="indicators" id="indicators" aria-label="Choose slide"></div>
            <div class="counter" id="counter">1 / 5</div>
        </div>

        <p class="hint">Hover over the image to pause auto-play.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
